name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja Rusta (musl – statyczna binarka)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Testy
        run: cargo test
      - name: Budowanie
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Pakowanie
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/epson-druk dist/
          cp README.md dist/
          tar -czf epson-druk-linux-x86_64.tar.gz -C dist .
      - name: Publikacja wydania
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: epson-druk-linux-x86_64.tar.gz
      - name: Artefakt (uruchomienie ręczne)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: epson-druk-linux-x86_64
          path: epson-druk-linux-x86_64.tar.gz
